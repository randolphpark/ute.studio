name: Deploy newsletter Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsletter-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: newsletter-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEWSLETTER_D1_ID: ${{ vars.NEWSLETTER_D1_ID }}
      RESEND_SEGMENT_ID: ${{ vars.RESEND_SEGMENT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:worker
      - run: npm run worker:check
      - name: Check deployment settings
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          node --input-type=module <<'JS'
          for (const key of ['CLOUDFLARE_ACCOUNT_ID', 'CLOUDFLARE_API_TOKEN', 'RESEND_API_KEY', 'TURNSTILE_SECRET_KEY']) {
            if (!process.env[key]) throw new Error(`Missing ${key}`);
          }
          JS
          npm run worker:config
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply ute-studio-newsletter --remote --config worker/wrangler.generated.json
      - name: Deploy Worker
        run: npx wrangler deploy --config worker/wrangler.generated.json
      - name: Install Worker secrets
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: node scripts/newsletter-secrets.mjs
